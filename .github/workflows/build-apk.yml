name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger from the Actions tab

permissions:
  contents: write # allow publishing the APK to GitHub Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Install client dependencies & build web app
        working-directory: client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Sync Capacitor (copy web app into Android project)
        working-directory: client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paisaflow-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: PaisaFlow APK — latest build
          body: |
            📱 Auto-built Android APK from the latest code.

            **How to install:**
            1. Download `app-debug.apk` below on your Android phone
            2. Open it and allow "Install unknown apps" when prompted
            3. Open PaisaFlow → tap "Using the Android app? Set server URL" on the login screen
            4. Paste your server's URL (where the website runs, e.g. your Render/Railway URL) → Save → sign in

            Every new push to `main` rebuilds this APK automatically.
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
